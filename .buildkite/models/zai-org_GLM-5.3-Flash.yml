steps:
  - label: "${TPU_VERSION:-tpu6e} Unit tests for zai-org/GLM-5.3-Flash"
    key: "${TPU_VERSION:-tpu6e}_zai-org_GLM-5.3-Flash_UnitTest"
    soft_fail: true
    agents:
      queue: "${TPU_QUEUE_SINGLE:-tpu_v6e_queue}"
    env:
      NEW_MODEL_DESIGN: "1"
    commands:
      - |
        .buildkite/scripts/run_in_docker.sh \
          bash -c 'python3 -m pytest -s -v /workspace/tpu_inference/tests/models/jax/test_glm5_next_ref.py /workspace/tpu_inference/tests/models/jax/test_glm5_next_layers.py /workspace/tpu_inference/tests/models/jax/test_glm5_next.py /workspace/tpu_inference/tests/layers/jax/attention/test_kda.py /workspace/tpu_inference/tests/layers/common/test_kda_attention.py /workspace/tpu_inference/tests/runner/test_glm5_next_kv_cache.py'
  - label: "${TPU_VERSION:-tpu6e} Record unittest result for zai-org/GLM-5.3-Flash"
    key: "${TPU_VERSION:-tpu6e}_record_zai-org_GLM-5.3-Flash_UnitTest"
    depends_on: "${TPU_VERSION:-tpu6e}_zai-org_GLM-5.3-Flash_UnitTest"
    env:
      CI_TPU_VERSION: "${TPU_VERSION:-tpu6e}"
      CI_TARGET: "zai-org/GLM-5.3-Flash"
      CI_STAGE: "UnitTest"
      CI_CATEGORY: "text-only"
    agents:
      queue: cpu
    commands:
      - |
        .buildkite/scripts/record_step_result.sh ${TPU_VERSION:-tpu6e}_zai-org_GLM-5.3-Flash_UnitTest

  - label: "${TPU_VERSION:-tpu6e} Accuracy for zai-org/GLM-5.3-Flash"
    key: "${TPU_VERSION:-tpu6e}_zai-org_GLM-5.3-Flash_Accuracy"
    depends_on: "${TPU_VERSION:-tpu6e}_record_zai-org_GLM-5.3-Flash_UnitTest"
    soft_fail: true
    agents:
      queue: cpu
    commands:
      - |
        # The FP8 checkpoint needs ~303 GiB of HBM: a 4-host v6e-16 (TP=16, Ray), not a CI queue.
        buildkite-agent meta-data set "${TPU_VERSION:-tpu6e}_zai-org_GLM-5.3-Flash_Accuracy" "not enough HBM"
  - label: "${TPU_VERSION:-tpu6e} Record accuracy result for zai-org/GLM-5.3-Flash"
    key: "${TPU_VERSION:-tpu6e}_record_zai-org_GLM-5.3-Flash_Accuracy"
    depends_on: "${TPU_VERSION:-tpu6e}_zai-org_GLM-5.3-Flash_Accuracy"
    env:
      CI_TPU_VERSION: "${TPU_VERSION:-tpu6e}"
      CI_TARGET: "zai-org/GLM-5.3-Flash"
      CI_STAGE: "Accuracy/Correctness"
      CI_CATEGORY: "text-only"
    agents:
      queue: cpu
    commands:
      - |
        .buildkite/scripts/record_step_result.sh ${TPU_VERSION:-tpu6e}_zai-org_GLM-5.3-Flash_Accuracy

  - label: "${TPU_VERSION:-tpu6e} Performance benchmarks for zai-org/GLM-5.3-Flash"
    key: "${TPU_VERSION:-tpu6e}_zai-org_GLM-5.3-Flash_Benchmark"
    depends_on: "${TPU_VERSION:-tpu6e}_record_zai-org_GLM-5.3-Flash_Accuracy"
    soft_fail: true
    agents:
      queue: cpu
    commands:
      - |
        # The FP8 checkpoint needs ~303 GiB of HBM: a 4-host v6e-16 (TP=16, Ray), not a CI queue.
        buildkite-agent meta-data set "${TPU_VERSION:-tpu6e}_zai-org_GLM-5.3-Flash_Benchmark" "not enough HBM"
  - label: "${TPU_VERSION:-tpu6e} Record benchmark result for zai-org/GLM-5.3-Flash"
    key: "${TPU_VERSION:-tpu6e}_record_zai-org_GLM-5.3-Flash_Benchmark"
    depends_on: "${TPU_VERSION:-tpu6e}_zai-org_GLM-5.3-Flash_Benchmark"
    env:
      CI_TPU_VERSION: "${TPU_VERSION:-tpu6e}"
      CI_TARGET: "zai-org/GLM-5.3-Flash"
      CI_STAGE: "Benchmark"
      CI_CATEGORY: "text-only"
    agents:
      queue: cpu
    commands:
      - |
        .buildkite/scripts/record_step_result.sh ${TPU_VERSION:-tpu6e}_zai-org_GLM-5.3-Flash_Benchmark
